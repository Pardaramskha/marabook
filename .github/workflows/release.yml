# Release automatique de Marabook (Avalonia, .NET 8 — trois systèmes).
#
# Organisation des branches :
#   main  branche de release : ne reçoit que des fusions de dev
#   dev   pré-release et bac à sable : toutes les branches de travail
#         (feat/…, fix/…, hotfix/…) partent de dev et y reviennent
#   Les branches fusionnées par PR sont supprimées automatiquement
#   (réglage du dépôt) ; main et dev sont protégées contre la suppression
#   (ruleset « Branches permanentes »).
#
# Ce workflow tourne à chaque poussée sur dev (essai à blanc : compile,
# teste et fabrique sans rien publier, pour vérifier que la release
# passerait) et sur main (donc à chaque fusion dev > main), où il publie
# une release GitHub :
#   1. lit VERSION (à incrémenter sur dev AVANT de fusionner : si le tag
#      vVERSION existe déjà, le workflow échoue plutôt que d'écraser)
#   2. sur Windows, Ubuntu et macOS : compile, lance les tests du cœur
#      (dotnet test) et la sonde de l'application (--probe, sous Xvfb
#      sur Ubuntu), fabrique l'archive du système (tools/publish.ps1)
#      — plus l'installeur sur Windows (tools/release.ps1)
#   3. crée la release vVERSION avec les assets à noms stables
#      (le README et l'Updater pointent releases/latest → jamais en
#      « pre-release », même avec un suffixe -beta) :
#        marabook-windows-portable.zip   Marabook-Setup-Windows.exe
#        marabook-linux-x64.tar.gz
#        marabook-macos-x64.zip          marabook-macos-arm64.zip
#   4. ne garde que les 3 releases les plus récentes, supprime les
#      autres (release + tag)
#
# Lancement manuel (Actions > Release > Run workflow) : par défaut un
# essai à blanc ; décocher « dry_run » depuis main pour publier à la main.

name: Release

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Essai à blanc : fabriquer sans publier ni supprimer"
        type: boolean
        default: true

permissions:
  contents: write

# Une seule publication à la fois ; sur dev, un nouvel essai remplace le précédent.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GH_TOKEN: ${{ github.token }}
  KEEP_RELEASES: "3"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7

      - name: Lire VERSION
        id: version
        shell: pwsh
        run: |
          $v = ([IO.File]::ReadAllText('VERSION')).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$') {
            throw "VERSION doit être de la forme majeure.mineure.correctif[-suffixe] (lu : « $v »)."
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version : $v (tag v$v)"

      - name: Vérifier que la release n'existe pas déjà
        if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "La release $tag existe déjà. Incrémentez VERSION (et Model/AppInfo.cs) sur dev avant de fusionner sur main."
          }
          $tags = git ls-remote --tags origin "refs/tags/$tag"
          if ($tags) {
            throw "Le tag $tag existe déjà sur le dépôt sans release. Supprimez-le ou incrémentez VERSION."
          }
          Write-Host "OK : $tag est libre."

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            assets: "dist/marabook-windows-portable.zip dist/Marabook-Setup-Windows.exe"
          - os: ubuntu-latest
            rid: linux-x64
            assets: "dist/marabook-linux-x64.tar.gz"
          - os: macos-latest
            rid: osx-arm64
            assets: "dist/marabook-macos-arm64.zip"
          - os: macos-15-intel
            rid: osx-x64
            assets: "dist/marabook-macos-x64.zip"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v7

      - name: Installer le SDK .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Vérifier les données linguistiques embarquées
        shell: pwsh
        run: |
          & ./tools/verify-dict.ps1
          if ($LASTEXITCODE -ne 0) { throw "Dictionnaire absent ou corrompu." }

      - name: Tests du cœur (C1–C44, harnais console)
        shell: pwsh
        run: |
          dotnet run --project dotnet/Marabook.Tests -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) { throw "Les tests du cœur échouent (code $LASTEXITCODE)." }

      - name: Compiler l'application
        shell: pwsh
        run: |
          dotnet build dotnet/Marabook.App -c Release --nologo -v q
          if ($LASTEXITCODE -ne 0) { throw "La compilation de l'application échoue." }

      - name: Sonde de l'application (Windows, macOS)
        if: ${{ runner.os != 'Linux' }}
        shell: pwsh
        run: |
          # Par l'hôte « dotnet » et non Marabook.exe : sur Windows, l'exécutable
          # est une application FENÊTRÉE que PowerShell n'attend pas ($LASTEXITCODE
          # reste vide et la sonde continue en arrière-plan — 01/10) ; l'hôte
          # console attend et rend le code de retour sur les deux systèmes.
          dotnet dotnet/Marabook.App/bin/Release/net8.0/Marabook.dll --probe --settings (Join-Path ([IO.Path]::GetTempPath()) 'marabook-sonde.json')
          if ($LASTEXITCODE -ne 0) { throw "La sonde signale $LASTEXITCODE échec(s)." }

      - name: Sonde de l'application (Ubuntu, sous Xvfb)
        if: ${{ runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libx11-6 libice6 libsm6 libfontconfig1 fonts-liberation > /dev/null
          xvfb-run -a dotnet/Marabook.App/bin/Release/net8.0/Marabook --probe --settings /tmp/marabook-sonde.json

      - name: Fabriquer l'archive (${{ matrix.rid }})
        shell: pwsh
        run: |
          & ./tools/publish.ps1 -Rid ${{ matrix.rid }}
          if ($LASTEXITCODE -ne 0) { throw "tools/publish.ps1 a échoué." }

      - name: Fabriquer l'installeur Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          & ./tools/release.ps1 -SkipPublish
          if ($LASTEXITCODE -ne 0) { throw "tools/release.ps1 a échoué." }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Conserver les artefacts
        uses: actions/upload-artifact@v7
        with:
          name: marabook-${{ needs.version.outputs.version }}-${{ matrix.rid }}
          path: ${{ matrix.assets }}
          retention-days: 7

  publish:
    needs: [version, build]
    if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les artefacts
        uses: actions/download-artifact@v7
        with:
          path: artefacts
          merge-multiple: true

      - name: Publier la release
        shell: pwsh
        run: |
          $tag = '${{ needs.version.outputs.tag }}'
          $version = '${{ needs.version.outputs.version }}'
          $assets = Get-ChildItem artefacts -Recurse -File | ForEach-Object { $_.FullName }
          Write-Host "Assets : $($assets -join ', ')"
          gh release create $tag @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Marabook $version" `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw "gh release create a échoué." }
          Write-Host "Release $tag publiée."

      - name: Ne garder que les ${{ env.KEEP_RELEASES }} releases les plus récentes
        shell: pwsh
        run: |
          $keep = [int]$env:KEEP_RELEASES
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 `
            --json tagName,createdAt,isDraft | ConvertFrom-Json
          $releases = $releases | Where-Object { -not $_.isDraft } |
            Sort-Object { [DateTime]$_.createdAt } -Descending
          $aSupprimer = @($releases | Select-Object -Skip $keep)
          if ($aSupprimer.Count -eq 0) {
            Write-Host "Rien à supprimer ($($releases.Count) release(s), maximum $keep)."
            exit 0
          }
          foreach ($r in $aSupprimer) {
            Write-Host "Suppression de la release $($r.tagName) ($($r.createdAt)) et de son tag…"
            gh release delete $r.tagName --repo $env:GITHUB_REPOSITORY --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { throw "Suppression de $($r.tagName) ratée." }
          }
          Write-Host "Conservées : $(($releases | Select-Object -First $keep | ForEach-Object tagName) -join ', ')"
